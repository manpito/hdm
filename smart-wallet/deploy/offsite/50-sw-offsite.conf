# SmartWallet: contas de depósito de cópias cifradas (só SFTP, só escrita em incoming/)
Match Group sw-offsite
    ChrootDirectory /srv/sw-offsite/%u
    AuthorizedKeysFile /etc/ssh/sw-offsite-keys/%u
    ForceCommand internal-sftp -l INFO -P read,readdir,opendir,remove,rmdir,mkdir,setstat,fsetstat,lsetstat,symlink,hardlink,posix-rename,copy-data
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
